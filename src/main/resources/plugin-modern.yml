name: StaffCore
version: 1.2.4
main: com.github.staffcore.StaffCore
api-version: 1.20
author: StaffCoreDev
description: Complete Management & Moderation Suite with GUI, Vanish, Freeze, Jail, Spawn, Warps, Homes, BungeeCord, and Utilities.

commands:
  ban:
    description: Permanently bans a player.
    usage: /ban <player> [reason] [-s]
    permission: staffcore.command.ban
  tempban:
    description: Temporarily bans a player for a specific duration.
    usage: /tempban <player> <duration> [reason] [-s]
    permission: staffcore.command.tempban
  ipban:
    description: Permanently IP bans a player or IP address.
    aliases: [ban-ip, banip, ip-ban]
    usage: /ipban <player|ip> [reason] [-s]
    permission: staffcore.command.ipban
  tempipban:
    description: Temporarily IP bans a player or IP address.
    aliases: [tempban-ip, tempbanip]
    usage: /tempipban <player|ip> <duration> [reason] [-s]
    permission: staffcore.command.tempipban
  unban:
    description: Unbans a banned player.
    aliases: [pardon]
    usage: /unban <player>
    permission: staffcore.command.unban
  unbanip:
    description: Unbans a banned IP address using player IGN or IP.
    aliases: [pardon-ip, pardonip, unban-ip]
    usage: /unbanip <player>
    permission: staffcore.command.unbanip
  mute:
    description: Permanently mutes a player.
    usage: /mute <player> [reason] [-s]
    permission: staffcore.command.mute
  tempmute:
    description: Temporarily mutes a player.
    usage: /tempmute <player> <duration> [reason] [-s]
    permission: staffcore.command.tempmute
  unmute:
    description: Unmutes a muted player.
    usage: /unmute <player>
    permission: staffcore.command.unmute
  warn:
    description: Warns a player.
    usage: /warn <player> [reason] [-s]
    permission: staffcore.command.warn
  setjail:
    description: Sets a jail spawn location at your current position.
    usage: /setjail <jail_name>
    permission: staffcore.command.setjail
  deljail:
    description: Deletes an existing jail location.
    usage: /deljail <jail_name>
    permission: staffcore.command.setjail
  jail:
    description: Permanently jails a player at a specified jail.
    usage: /jail <player> <jail_name> [reason] [-s]
    permission: staffcore.command.jail
  tempjail:
    description: Temporarily jails a player at a specified jail.
    usage: /tempjail <player> <jail_name> <duration> [reason] [-s]
    permission: staffcore.command.tempjail
  unjail:
    description: Releases a jailed player.
    usage: /unjail <player>
    permission: staffcore.command.unjail
  freeze:
    description: Toggles freeze on a player for staff inspection.
    usage: /freeze <player>
    permission: staffcore.command.freeze
  check:
    description: Opens an inspection GUI showing player stats and punishment history.
    usage: /check <player>
    permission: staffcore.command.check
  chat:
    description: Switches between staff chat and global chat.
    usage: /chat <staff|all>
    permission: staffcore.command.chat
  vanish:
    description: Toggles complete invisibility and hides you from tab list and player counter.
    aliases: [v]
    usage: /vanish
    permission: staffcore.command.vanish
  staffcore:
    description: Reloads plugin configuration or checks for updates.
    usage: /staffcore <reload|update>
    permission: staffcore.admin

  # Spawn, Warps & Homes
  setspawn:
    description: Sets the server spawn point at your current location.
    usage: /setspawn
    permission: staffcore.command.setspawn
  spawn:
    description: Teleports you to the server spawn point.
    usage: /spawn [player|*]
    permission: staffcore.command.spawn
  setwarp:
    description: Creates or updates a server or personal warp.
    usage: /setwarp <warp_name>
    permission: staffcore.command.setwarp
  delwarp:
    description: Deletes a warp.
    usage: /delwarp <warp_name>
    permission: staffcore.command.delwarp
  warp:
    description: Teleports you to a server warp.
    usage: /warp <warp_name> [player|*]
    permission: staffcore.command.warp
  sethome:
    description: Sets a personal home at your current location.
    usage: /sethome [home_name]
    permission: staffcore.command.sethome
  delhome:
    description: Deletes one of your personal homes.
    usage: /delhome <home_name>
    permission: staffcore.command.delhome
  home:
    description: Teleports you to one of your personal homes.
    usage: /home [home_name]
    permission: staffcore.command.home

  # Staff Utility Suite
  gmc:
    description: Switches game mode to Creative.
    usage: /gmc [player|*]
    permission: staffcore.command.gamemode
  gms:
    description: Switches game mode to Survival.
    usage: /gms [player|*]
    permission: staffcore.command.gamemode
  gmsp:
    description: Switches game mode to Spectator.
    usage: /gmsp [player|*]
    permission: staffcore.command.gamemode
  gma:
    description: Switches game mode to Adventure.
    usage: /gma [player|*]
    permission: staffcore.command.gamemode
  fly:
    description: Toggles flight mode.
    usage: /fly [player|*]
    permission: staffcore.command.fly
  speed:
    description: Adjusts walking or flying speed from 1 to 10.
    usage: /speed <1-10> [player|*]
    permission: staffcore.command.speed
  invincible:
    description: Toggles invulnerability and hunger prevention.
    aliases: [godmode]
    usage: /invincible [player|*]
    permission: staffcore.command.invincible
  tphere:
    description: Teleports player(s) directly to your position.
    usage: /tphere <player|*>
    permission: staffcore.command.teleport
  tpall:
    description: Teleports all players to you or specific coordinates.
    usage: /tpall [player | x y z]
    permission: staffcore.command.teleport
  invsee:
    description: Opens and live-syncs a target player inventory including armor.
    usage: /invsee <player>
    permission: staffcore.command.invsee
  enchant:
    description: Applies unsafe enchantments up to level 255.
    usage: /enchant <enchantment> [level]
    permission: staffcore.command.enchant
  sendserver:
    description: Forcibly sends a player or all players to another BungeeCord server.
    usage: /sendserver <player|*> <server>
    permission: staffcore.command.sendserver
  heal:
    description: Restores health, hunger, saturation, and cures effects.
    usage: /heal [player|*]
    permission: staffcore.command.heal
  feed:
    description: Satisfies hunger and restores saturation.
    usage: /feed [player|*]
    permission: staffcore.command.feed
  repair:
    description: Restores held item durability to full.
    aliases: [fix]
    usage: /repair
    permission: staffcore.command.repair
  struck:
    description: Strikes lightning at target player or crosshair.
    aliases: [strike, smite]
    usage: /struck [player|*]
    permission: staffcore.command.struck
  sudo:
    description: Forces player(s) to execute a command or send a chat message.
    usage: /sudo <player|*> <command | m:message>
    permission: staffcore.command.sudo
  give:
    description: Gives items to a player with tab-completion support across all versions.
    usage: /give <player|*> <item> [amount]
    permission: staffcore.command.give
  effect:
    description: Applies or clears potion effects with custom duration and level.
    usage: /effect <player|*> <potion|clear> [seconds] [level]
    permission: staffcore.command.effect
  cleargrounditems:
    description: Cleans up all dropped item entities across all loaded worlds.
    aliases: [cleargrouditems, clearitems, clearlag]
    usage: /cleargrounditems
    permission: staffcore.command.cleargrounditems
  clear:
    description: Clears inventory, armor, and off-hand items.
    aliases: [ci, clearinventory]
    usage: /clear [player|*]
    permission: staffcore.command.clear

