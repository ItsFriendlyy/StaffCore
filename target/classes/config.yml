# ========================================================
#            StaffCore Configuration File
#   Customize all messages, titles, formats, & settings
# ========================================================

prefix: "&8[&cStaffCore&8] &r"

# ========================================================
#             BungeeCord & Network Settings
#   Configure proxy connection and /sendserver support
# ========================================================
bungeecord:
  enabled: true
  server-name: "lobby"
  fallback-server: "lobby"

# ========================================================
#       Database / MySQL (Network Synchronization)
#   Synchronize bans, mutes, and stats across your proxy
# ========================================================
database:
  mysql-enabled: false
  host: "localhost"
  port: 3306
  database: "staffcore"
  username: "root"
  password: "your_password_here"
  ssl: false
  pool-size: 10
  sync-interval: 30

# ========================================================
#             bStats Metrics Telemetry
# ========================================================
bstats:
  enabled: true
  plugin-id: 34872

# ========================================================
#               Player Homes Configuration
# ========================================================
homes:
  # Base maximum homes for regular players (bypassed by staffcore.homes.10, staffcore.homes.15, staffcore.command.sethome.unlimited or op)
  max-homes: 5

# ========================================================
#               Player Warps Configuration
# ========================================================
warps:
  # Base maximum warps for regular players (bypassed by staffcore.warps.4, staffcore.warps.8, staffcore.warps.unlimited or op)
  max-warps: 2

# ========================================================
#                  General Plugin Messages
# ========================================================
messages:
  no-permission: "&cYou do not have permission to execute this command!"
  player-not-found: "&cPlayer &e%target% &cwas not found or has never joined!"
  cannot-punish-self: "&cYou cannot punish yourself!"
  cannot-punish-exempt: "&cYou cannot punish &e%target% &cbecause they have bypass permissions!"
  cannot-freeze-exempt: "&cYou cannot freeze &e%target% &cbecause they have bypass permissions!"
  cannot-jail-exempt: "&cYou cannot jail &e%target% &cbecause they have bypass permissions!"
  invalid-duration: "&cInvalid duration format! Example: 10m, 2h, 1d, 7d"
  unban-success: "&aSuccessfully unbanned &e%target%&a."
  not-banned: "&cPlayer &e%target% &cis not banned!"
  unbanip-success: "&aSuccessfully unbanned IP &e%ip%&a."
  ip-not-banned: "&cIP address &e%ip% &cis not banned!"
  unmute-success: "&aSuccessfully unmuted &e%target%&a."
  not-muted: "&cPlayer &e%target% &cis not muted!"
  setjail-success: "&aSuccessfully set jail &e%jail% &aat your current location."
  deljail-success: "&aSuccessfully deleted jail &e%jail%&a."
  jail-not-found: "&cJail &e%jail% &cwas not found! Set it first with &e/setjail %jail%&c."
  unjail-success: "&aSuccessfully unjailed &e%target%&a."
  not-jailed: "&cPlayer &e%target% &cis not jailed!"
  reload-success: "&aStaffCore configuration and data reloaded successfully!"
  command-blocked-frozen: "&cYou cannot execute commands while frozen!"
  action-blocked-frozen: "&cYou cannot interact or break blocks while frozen!"
  command-blocked-jailed: "&cYou cannot execute commands while jailed!"
  action-blocked-jailed: "&cYou cannot interact, throw items, or break blocks while jailed!"

  # Spawn, Warps & Homes Messages
  setspawn-success: "&aSuccessfully set the server spawn at your current location!"
  spawn-teleported: "&aTeleported to &espawn&a."
  spawn-not-set: "&cThe server spawn has not been set yet! Use &e/setspawn&c."
  setwarp-success: "&aSuccessfully set warp &e%warp% &aat your current location."
  delwarp-success: "&aSuccessfully deleted warp &e%warp%&a."
  warp-teleported: "&aTeleported to warp &e%warp%&a."
  warp-not-found: "&cWarp &e%warp% &cwas not found!"
  warp-limit-reached: "&cYou have reached the maximum limit of &e%max% &cwarps!"
  warp-is-private: "&cThis warp is private!"
  sethome-success: "&aSuccessfully set home &e%home% &aat your current location."
  delhome-success: "&aSuccessfully deleted home &e%home%&a."
  home-teleported: "&aTeleported to home &e%home%&a."
  home-not-found: "&cHome &e%home% &cwas not found!"
  no-homes-set: "&cYou do not have any homes set! Use &e/sethome <name> &cfirst."
  home-limit-reached: "&cYou have reached the maximum limit of &e%max% &chomes!"

  # BungeeCord & Network Messages
  bungee-disabled: "&cBungeeCord support is disabled in config.yml!"
  sendserver-success: "&aSending &e%target% &ato server &e%server%&a..."
  sendserver-failed: "&cFailed to send &e%target% &cto &e%server%&c."

# ========================================================
#                 Broadcast Notifications
# ========================================================
broadcasts:
  silent:
    ban: "&8[&cSilent&8] &7%staff% permanently banned &e%target% &7for: &f%reason%"
    tempban: "&8[&cSilent&8] &7%staff% temporarily banned &e%target% &7for &e%duration% &7for: &f%reason%"
    ipban: "&8[&cSilent&8] &7%staff% permanently IP-banned &e%target% &7for: &f%reason%"
    tempipban: "&8[&cSilent&8] &7%staff% temp IP-banned &e%target% &7for &e%duration% &7for: &f%reason%"
    mute: "&8[&cSilent&8] &7%staff% permanently muted &e%target% &7for: &f%reason%"
    tempmute: "&8[&cSilent&8] &7%staff% temporarily muted &e%target% &7for &e%duration% &7for: &f%reason%"
    warn: "&8[&cSilent&8] &7%staff% warned &e%target% &7for: &f%reason%"
    jail: "&8[&cSilent&8] &7%staff% permanently jailed &e%target% &7for: &f%reason%"
    tempjail: "&8[&cSilent&8] &7%staff% temp-jailed &e%target% &7for &e%duration% &7for: &f%reason%"
    kick: "&c&lPUNISH &8» &f%target% &7was kicked by &f%staff% &7for: &e%reason%"
  public:
    ban: "&c&lPUNISH &8» &f%target% &7was permanently banned by &f%staff% &7for: &e%reason%"
    tempban: "&c&lPUNISH &8» &f%target% &7was banned for &e%duration% &7by &f%staff% &7for: &e%reason%"
    ipban: "&c&lPUNISH &8» &f%target% &7was permanently IP banned by &f%staff% &7for: &e%reason%"
    tempipban: "&c&lPUNISH &8» &f%target% &7was temp IP banned for &e%duration% &7by &f%staff% &7for: &e%reason%"
    mute: "&c&lPUNISH &8» &f%target% &7was permanently muted by &f%staff% &7for: &e%reason%"
    tempmute: "&c&lPUNISH &8» &f%target% &7was muted for &e%duration% &7by &f%staff% &7for: &e%reason%"
    warn: "&c&lPUNISH &8» &f%target% &7was warned by &f%staff% &7for: &e%reason%"
    jail: "&c&lPUNISH &8» &f%target% &7was permanently jailed by &f%staff% &7for: &e%reason%"
    tempjail: "&c&lPUNISH &8» &f%target% &7was jailed for &e%duration% &7by &f%staff% &7for: &e%reason%"
    kick: "&8[&cSilent&8] &7%staff% kicked &e%target% &7for: &f%reason%"

# ========================================================
#                    Ban Screen Layouts
# ========================================================
screens:
  permanent-ban:
    - "&c&lYOU ARE PERMANENTLY BANNED!"
    - ""
    - "&7Reason: &f%reason%"
    - "&7Banned By: &f%staff%"
    - ""
    - "&7Appeal at: &ediscord.gg/yourserver"
  temporary-ban:
    - "&c&lYOU ARE TEMPORARILY BANNED!"
    - ""
    - "&7Reason: &f%reason%"
    - "&7Remaining Time: &e%remaining%"
    - "&7Banned By: &f%staff%"
    - ""
    - "&7Appeal at: &ediscord.gg/yourserver"
  permanent-ipban:
    - "&c&lYOUR IP ADDRESS IS PERMANENTLY BANNED!"
    - ""
    - "&7Reason: &f%reason%"
    - "&7Banned By: &f%staff%"
    - ""
    - "&7Appeal at: &ediscord.gg/yourserver"
  temporary-ipban:
    - "&c&lYOUR IP ADDRESS IS TEMPORARILY BANNED!"
    - ""
    - "&7Reason: &f%reason%"
    - "&7Remaining Time: &e%remaining%"
    - "&7Banned By: &f%staff%"
    - ""
    - "&7Appeal at: &ediscord.gg/yourserver"
  kick:
    - "&c&lYOU HAVE BEEN KICKED FROM THE SERVER"
    - ""
    - "&7Reason: &f%reason%"
    - "&7Kicked by: &f%staff%"

# ========================================================
#                 Warning System Settings
# ========================================================
warning:
  max-warnings: 3
  received:
    - "&c&m--------------------------------------------------"
    - "&c&lYOU HAVE RECEIVED A WARNING!"
    - "&7Reason: &f%reason%"
    - "&7Warned by: &f%staff%"
    - "&7Active Warnings: &e%count%&7/&c%max%"
    - "&cReaching %max% warnings will result in an automatic ban!"
    - "&c&m--------------------------------------------------"

# ========================================================
#                  Jail System Settings
# ========================================================
jail:
  permanent-chat:
    - "&c&m--------------------------------------------------"
    - "&c&lYOU HAVE BEEN PERMANENTLY JAILED!"
    - "&7Jail: &e%jail%"
    - "&7Reason: &f%reason%"
    - "&7Jailed by: &f%staff%"
    - "&c&m--------------------------------------------------"
  temporary-chat:
    - "&c&m--------------------------------------------------"
    - "&c&lYOU HAVE BEEN TEMPORARILY JAILED!"
    - "&7Jail: &e%jail%"
    - "&7Reason: &f%reason%"
    - "&7Remaining Time: &e%remaining%"
    - "&7Jailed by: &f%staff%"
    - "&c&m--------------------------------------------------"
  unjail-target: "&aYou have been released from jail and returned to your previous position!"