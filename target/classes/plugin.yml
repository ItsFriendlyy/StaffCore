name: StaffCore
version: 1.0.4
main: com.github.staffcore.StaffCore
author: StaffCoreDev
description: Complete Management & Moderation Suite with GUI, Vanish, Freeze, BungeeCord, and Utilities.

commands:
  ban:
    description: Permanently bans a player.
    usage: /ban <player> [reason] [-s]
    permission: staffcore.command.ban
  tempban:
    description: Temporarily bans a player for a specific duration.
    usage: /tempban <player> <duration> [reason] [-s]
    permission: staffcore.command.tempban
  ipban:
    description: Permanently IP bans a player or IP address.
    aliases: [ban-ip, banip, ip-ban]
    usage: /ipban <player|ip> [reason] [-s]
    permission: staffcore.command.ipban
  tempipban:
    description: Temporarily IP bans a player or IP address.
    aliases: [tempban-ip, tempbanip]
    usage: /tempipban <player|ip> <duration> [reason] [-s]
    permission: staffcore.command.tempipban
  unban:
    description: Unbans a banned player.
    aliases: [pardon]
    usage: /unban <player>
    permission: staffcore.command.unban
  unbanip:
    description: Unbans a banned IP address using player IGN or IP.
    aliases: [pardon-ip, pardonip, unban-ip]
    usage: /unbanip <player>
    permission: staffcore.command.unbanip
  mute:
    description: Permanently mutes a player.
    usage: /mute <player> [reason] [-s]
    permission: staffcore.command.mute
  tempmute:
    description: Temporarily mutes a player.
    usage: /tempmute <player> <duration> [reason] [-s]
    permission: staffcore.command.tempmute
  unmute:
    description: Unmutes a muted player.
    usage: /unmute <player>
    permission: staffcore.command.unmute
  warn:
    description: Warns a player.
    usage: /warn <player> [reason] [-s]
    permission: staffcore.command.warn
  freeze:
    description: Toggles freeze on a player for staff inspection.
    usage: /freeze <player>
    permission: staffcore.command.freeze
  check:
    description: Opens an inspection GUI showing player stats and punishment history.
    usage: /check <player>
    permission: staffcore.command.check
  chat:
    description: Switches between staff chat and global chat.
    usage: /chat <staff|all>
    permission: staffcore.command.chat
  vanish:
    description: Toggles complete invisibility and hides you from tab list and player counter.
    aliases: [v]
    usage: /vanish
    permission: staffcore.command.vanish
  staffcore:
    description: Reloads plugin configuration.
    usage: /staffcore reload
    permission: staffcore.admin

  # Staff Utility Suite
  gmc:
    description: Switches game mode to Creative.
    usage: /gmc [player]
    permission: staffcore.command.gamemode
  gms:
    description: Switches game mode to Survival.
    usage: /gms [player]
    permission: staffcore.command.gamemode
  gmsp:
    description: Switches game mode to Spectator.
    usage: /gmsp [player]
    permission: staffcore.command.gamemode
  gma:
    description: Switches game mode to Adventure.
    usage: /gma [player]
    permission: staffcore.command.gamemode
  fly:
    description: Toggles flight mode without changing game mode.
    usage: /fly [player]
    permission: staffcore.command.fly
  speed:
    description: Sets walk or fly speed from 1 (normal) to 10 (fast).
    usage: /speed <1-10> [player]
    permission: staffcore.command.speed
  invincible:
    description: Makes a player invincible to all damage and hunger.
    usage: /invincible [player]
    permission: staffcore.command.invincible
  tphere:
    description: Teleports a player to your current location.
    usage: /tphere <player>
    permission: staffcore.command.teleport
  tpall:
    description: Teleports all online players to you or to coordinates.
    usage: /tpall [player | x y z]
    permission: staffcore.command.teleport
  invsee:
    description: Inspects and edits player inventory, armor, and off-hand in one unified GUI.
    usage: /invsee <player>
    permission: staffcore.command.invsee
  enchant:
    description: Adds an unsafe enchantment at any level (1-255) to the item in hand.
    usage: /enchant <enchantment> [level (1-255)]
    permission: staffcore.command.enchant
  sendserver:
    description: Sends a player to another server via BungeeCord.
    usage: /sendserver <player> <server>
    permission: staffcore.command.sendserver
  heal:
    description: Fully restores health, hunger, saturation, and clears negative effects.
    usage: /heal [player]
    permission: staffcore.command.heal
  feed:
    description: Fully satisfies hunger and restores saturation.
    usage: /feed [player]
    permission: staffcore.command.feed
  repair:
    description: Restores the held item to full durability.
    usage: /repair
    permission: staffcore.command.repair
  struck:
    description: Strikes lightning at a target player or crosshair location.
    aliases: [strike]
    usage: /struck [player]
    permission: staffcore.command.struck
  sudo:
    description: Forces a player to run a command or send a chat message.
    usage: /sudo <player> <command | m:message>
    permission: staffcore.command.sudo

permissions:
  staffcore.command.ban:
    description: Allows banning players.
    default: op
  staffcore.command.tempban:
    description: Allows tempbanning players.
    default: op
  staffcore.command.ipban:
    description: Allows IP banning players.
    default: op
  staffcore.command.tempipban:
    description: Allows temp IP banning players.
    default: op
  staffcore.command.unban:
    description: Allows unbanning players.
    default: op
  staffcore.command.unbanip:
    description: Allows unbanning IP addresses.
    default: op
  staffcore.command.mute:
    description: Allows muting players.
    default: op
  staffcore.command.tempmute:
    description: Allows temp-muting players.
    default: op
  staffcore.command.unmute:
    description: Allows unmuting players.
    default: op
  staffcore.command.warn:
    description: Allows warning players.
    default: op
  staffcore.command.freeze:
    description: Allows freezing players.
    default: op
  staffcore.command.check:
    description: Allows opening the /check punishment & stats GUI.
    default: op
  staffcore.command.chat:
    description: Allows toggling staff chat.
    default: op
  staffcore.command.vanish:
    description: Allows toggling vanish.
    default: op
  staffcore.command.gamemode:
    description: Allows changing game modes (/gmc, /gms, /gmsp, /gma).
    default: op
  staffcore.command.fly:
    description: Allows toggling fly mode.
    default: op
  staffcore.command.speed:
    description: Allows changing player speed.
    default: op
  staffcore.command.invincible:
    description: Allows toggling invincibility.
    default: op
  staffcore.command.teleport:
    description: Allows using /tphere and /tpall.
    default: op
  staffcore.command.invsee:
    description: Allows viewing and editing player inventories.
    default: op
  staffcore.command.enchant:
    description: Allows unsafe high-level enchanting.
    default: op
  staffcore.command.sendserver:
    description: Allows sending players to other BungeeCord servers.
    default: op
  staffcore.command.heal:
    description: Allows healing players.
    default: op
  staffcore.command.feed:
    description: Allows feeding players.
    default: op
  staffcore.command.repair:
    description: Allows repairing items.
    default: op
  staffcore.command.struck:
    description: Allows striking lightning.
    default: op
  staffcore.command.sudo:
    description: Allows forcing players to execute commands or chat messages.
    default: op
  staffcore.admin:
    description: Full administration permissions.
    default: op
  staffcore.staff:
    description: General staff permission (receives staff notifications).
    default: op
  staffcore.staffchat:
    description: Receives and sends messages in staff chat.
    default: op
  staffcore.broadcast.silent:
    description: Receives silent (-s) punishment broadcast announcements.
    default: op
  staffcore.vanish.see:
    description: Allows seeing vanished staff members in-game and tab list.
    default: op
  staffcore.vanish.notify:
    description: Receives vanish toggle notification alerts.
    default: op
  staffcore.freeze.alerts:
    description: Receives alerts if a frozen player disconnects.
    default: op
  staffcore.check.ip:
    description: Displays player IP in the /check GUI.
    default: op
  staffcore.bypass.ban:
    description: Protects a player from being banned or temp-banned.
    default: op
  staffcore.bypass.mute:
    description: Protects a player from being muted or temp-muted.
    default: op
  staffcore.bypass.freeze:
    description: Protects a player from being frozen.
    default: op
  staffcore.bypass.warn:
    description: Protects a player from being warned.
    default: op